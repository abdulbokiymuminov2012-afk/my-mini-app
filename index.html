<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Заказ услуг</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background-color: var(--tg-theme-bg-color, #ffffff);
      color: var(--tg-theme-text-color, #000000);
      padding: 20px;
      margin: 0;
    }
    h2 { text-align: center; margin-bottom: 20px; }
    .form-group { margin-bottom: 15px; }
    label { display: block; margin-bottom: 5px; font-weight: bold; }
    input, select {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 8px;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 14px;
      background-color: var(--tg-theme-button-color, #0088cc);
      color: var(--tg-theme-button-text-color, #ffffff);
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }
  </style>
</head>
<body>

  <h2>Оформить заказ</h2>

  <form id="orderForm">
    <div class="form-group">
      <label for="name">Ваше имя:</label>
      <input type="text" id="name" placeholder="Введите имя" required>
    </div>

    <div class="form-group">
      <label for="phone">Номер телефона:</label>
      <input type="tel" id="phone" placeholder="+998 90 123 45 67" required>
    </div>

    <div class="form-group">
      <label for="service">Выберите услугу:</label>
      <select id="service">
        <option value="Дизайн">Дизайн</option>
        <option value="Разработка">Разработка</option>
        <option value="Консультация">Консультация</option>
      </select>
    </div>

    <button type="submit">Отправить заказ</button>
  </form>

  <script>
    const tg = window.Telegram ? window.Telegram.WebApp : null;
    if (tg) tg.expand();

    const BOT_TOKEN = '8782008755:AAGQ-S9KhEoMxf7M9LDzrAq_PNNdae5lVOI';
    const CHAT_ID = '5958507555';

    document.getElementById('orderForm').addEventListener('submit', async function(e) {
      e.preventDefault();

      const name = document.getElementById('name').value;
      const phone = document.getElementById('phone').value;
      const service = document.getElementById('service').value;

      const message = `📦 *Новый заказ!*\n\n` +
                      `👤 *Имя:* ${name}\n` +
                      `📞 *Телефон:* ${phone}\n` +
                      `🛠 *Услуга:* ${service}`;

      try {
        const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: message,
            parse_mode: 'Markdown'
          })
        });

        if (response.ok) {
          alert('Заказ успешно отправлен!');
          if (tg) tg.close();
        } else {
          alert('Ошибка при отправке.');
        }
      } catch (error) {
        alert('Произошла ошибка соединения.');
      }
    });
  </script>
</body>
</html>
